[project]
name = "dfragon-ocr-eval-worker"
version = "0.1.0"
description = "Local evaluation adapter for an existing ldb-ocr training runtime"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
